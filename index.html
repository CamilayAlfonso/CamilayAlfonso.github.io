<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Camila & Alfonso · Nos casamos</title>
<meta name="description" content="Camila & Alfonso — 30 de enero de 2027, Villarrica. ¡Queremos celebrarlo contigo!">
<meta property="og:title" content="Camila & Alfonso ¡Te invitan a su matrimonio!">
<meta property="og:description" content="30 de enero de 2027 · Presiona para abrir la invitación 💌">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{ --cream:#f6f2e9; --taupe:#867868; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--cream);color:var(--taupe);font-family:'EB Garamond',serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}

.stage{max-width:480px;margin:0 auto;position:relative}

/* ══════════ EL SOBRE (imagen · pantalla inicial) ══════════ */
#cover{
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  background:#e1dad2;cursor:pointer;position:relative;overflow:hidden;transition:opacity .9s ease;
}
#cover.gone{opacity:0;pointer-events:none}
.sobre-img{
  height:100dvh;width:auto;max-width:100%;object-fit:contain;display:block;transform-origin:50% 57%;
  transition:transform 1.1s cubic-bezier(.5,.05,.2,1), opacity 1.1s ease;
}
#cover.opening .sobre-img{transform:scale(2.5);opacity:0}

/* ══════════ INVITACIÓN (páginas del PDF) ══════════ */
#invitation{opacity:0;max-height:0;overflow:hidden;transition:opacity 1s ease}
#invitation.show{opacity:1;max-height:none;overflow:visible}

.page{position:relative;display:block;container-type:inline-size}
.page img{width:100%;display:block}

/* cuenta regresiva sobre la página 2 */
.cd{position:absolute;top:52.4%;transform:translate(-50%,-100%);text-align:center;
  font-family:'EB Garamond',serif;font-weight:500;color:var(--taupe);line-height:1;font-size:13cqw}
#cd-d{left:18.8%}
#cd-h{left:50.6%}
#cd-m{left:80.9%}

/* botón/zona de ubicación clickeable sobre las páginas 4 y 5 */
.maplink{position:absolute;display:flex;align-items:center;justify-content:center;
  text-decoration:none;color:var(--taupe);font-size:3.4cqw;letter-spacing:.18em;text-transform:uppercase;
  border-radius:10px;transition:background .25s}
.maplink:hover{background:rgba(134,120,104,.12)}
.maplink span{opacity:.9;pointer-events:none}
#cere-page .maplink{left:19%;top:72.4%;width:62%;height:12%}
#rec-page  .maplink{left:19%;top:66%;width:62%;height:12%}

/* reveal suave al hacer scroll */
.reveal{opacity:0;transform:translateY(24px);transition:opacity 1s ease, transform 1s ease}
.reveal.in{opacity:1;transform:none}
</style>
</head>
<body>
<div class="stage">

  <!-- ═══ EL SOBRE ═══ -->
  <section id="cover" role="button" tabindex="0" aria-label="Abrir invitación">
    <img class="sobre-img" id="sobre" src="img/sobre.jpg" alt="Presiona para abrir la invitación">
  </section>

  <!-- ═══ INVITACIÓN ═══ -->
  <div id="invitation">

    <!-- 1 · Portada -->
    <section class="page reveal"><img src="img/pag1.jpg" alt="Camila & Alfonso — Save the date · 30 de enero de 2027, Villarrica"></section>

    <!-- 2 · Cuenta regresiva (números dinámicos) -->
    <section class="page reveal" id="count-page">
      <img src="img/pag2.jpg" alt="Cuenta regresiva">
      <div class="cd" id="cd-d">–</div>
      <div class="cd" id="cd-h">–</div>
      <div class="cd" id="cd-m">–</div>
    </section>

    <!-- 3 · Padres -->
    <section class="page reveal"><img src="img/pag3.jpg" alt="Con la bendición de Dios y la compañía de nuestros padres"></section>

    <!-- 4 · Ceremonia -->
    <section class="page reveal" id="cere-page">
      <img src="img/pag4.jpg" alt="Ceremonia · Catedral de Villarrica · 16:30 hrs">
      <a class="maplink" href="https://www.google.com/maps/place/catedral+de+villarrica/data=!4m2!3m1!1s0x9614623cc6a49cd3:0x51a614f02d4a52a3" target="_blank" rel="noopener"><span>Click aquí ↗</span></a>
    </section>

    <!-- 5 · Recepción -->
    <section class="page reveal" id="rec-page">
      <img src="img/pag5.jpg" alt="Recepción · Hotel El Parque · 18:00 hrs">
      <a class="maplink" href="https://www.google.com/maps/search/?api=1&query=Hotel%20el%20Parque%2C%20Villarrica" target="_blank" rel="noopener"><span>Click aquí ↗</span></a>
    </section>

  </div>
</div>

<script>
"use strict";
const cover=document.getElementById("cover"), invitation=document.getElementById("invitation");
let opened=false;
function abrir(){
  if(opened) return; opened=true;
  cover.classList.add("opening");
  invitation.classList.add("show");
  setTimeout(()=>{
    cover.classList.add("gone");
    setTimeout(()=>{ cover.style.display="none"; window.scrollTo({top:0,behavior:"instant"});
      revelar(); tick(); setInterval(tick,1000);
    },800);
  },1000);
}
cover.addEventListener("click",abrir);
cover.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();abrir();} });

/* reveal on scroll */
function revelar(){
  const io=new IntersectionObserver(es=>{ for(const e of es) if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} },{threshold:.12});
  document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
  requestAnimationFrame(()=>document.querySelector("#invitation .page")?.classList.add("in"));
}

/* cuenta regresiva → 30 enero 2027, 16:30 */
const target=new Date("2027-01-30T16:30:00-03:00").getTime();
function tick(){
  let diff=Math.max(0,target-Date.now());
  const d=Math.floor(diff/86400000); diff-=d*86400000;
  const h=Math.floor(diff/3600000);  diff-=h*3600000;
  const m=Math.floor(diff/60000);
  set("cd-d",d); set("cd-h",h); set("cd-m",m);
}
function set(id,v){ const el=document.getElementById(id); if(el) el.textContent=v; }

/* modo preview: muestra todo (?preview) */
if(location.search.includes("preview")){
  opened=true; invitation.classList.add("show"); cover.style.display="none";
  document.querySelectorAll(".reveal").forEach(el=>el.classList.add("in"));
  tick(); setInterval(tick,1000);
}
</script>
</body>
</html>
